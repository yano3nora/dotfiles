os:
  # coda 0.4.0+ は vim 互換の `+N` 行ジャンプに対応。`--` 以降は常に path 扱い。
  # editInTerminal: true で lazygit を suspend して TUI editor に切り替える。
  edit: 'coda -- {{filename}}'
  editAtLine: 'coda +{{line}} -- {{filename}}'
  editAtLineAndWait: 'coda +{{line}} -- {{filename}}'
  editInTerminal: true
gui:
  mouseEvents: true
git:
  # まず default (全部 true) で負荷を見る。重ければ以下を解除して止める。
  # autoDetectExternalChanges は 2 秒間隔の ref ポーリングなので autoRefresh と一緒に止めること。
  # autoFetch を止めると branches パネルの PR checks 表示が手動 fetch 時しか更新されなくなる。
  # autoRefresh: false
  # autoFetch: false
  # autoDetectExternalChanges: false
  fetchAll: false
  diffRenderers:
    - command: hunk pager --transparent-bg
