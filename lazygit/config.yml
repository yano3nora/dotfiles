os:
  # coda 0.4.0+ は vim 互換の `+N` 行ジャンプに対応。`--` 以降は常に path 扱い。
  # editInTerminal: true で lazygit を suspend して TUI editor に切り替える。
  edit: 'coda -- {{filename}}'
  editAtLine: 'coda +{{line}} -- {{filename}}'
  editAtLineAndWait: 'coda +{{line}} -- {{filename}}'
  editInTerminal: true
gui:
  mouseEvents: true
git:
  autoFetch: false
  # autoRefresh: false
  # autoDetectExternalChanges: false
  diffRenderers:
    - command: hunk pager --transparent-bg
# diffRenderers は描画専用で hunk の TUI は動かない。
# コメントや session を使いたいときは H で hunk 本体を起動する。
customCommands:
  - key: 'H'
    context: 'files'
    description: 'Open in hunk'
    command: 'hunk diff -- {{.SelectedFile.Name | quote}}'
    output: terminal
  - key: 'H'
    context: 'commits'
    description: 'Open in hunk'
    command: 'hunk show {{.SelectedCommit.Hash}}'
    output: terminal
