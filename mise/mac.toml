[tools]
node = "24.19.0"
python = "3.13.7"
jq = "latest"
ripgrep = "latest"
deno = "2.9.1"
java = "openjdk-25.0.2"
aws-cli = { version = "latest", symlink_bins = "true" }
hunk = "latest"
"github:yano3nora/gistan" = "0.8.1"
gitleaks = "latest"
"github:RivoLink/leaf" = "latest"
goreleaser = "latest"
"github:yano3nora/coda" = "0.8.3"
aws-sam-cli = { version = "1.163.0", symlink_bins = "true" }
yq = "latest"
"github:yano3nora/excel2json" = "latest"
"github:yano3nora/kawsay" = "0.1.1"
powershell-core = "latest"
"github:yano3nora/rubylize" = "0.2.0"
"github:yano3nora/jsonalize" = "0.1.0"
marp-cli = "latest"
gh = "latest"
bat = "latest"
direnv = "latest"
# aqua の fd は darwin/amd64 未対応のため、GitHub Release から直接取る ubi を使う。
"ubi:sharkdp/fd" = "latest"
fzf = "latest"
lazygit = "latest"
peco = "latest"
fastfetch = "latest"
yazi = "latest"
uv = "latest"
"pipx:pdm" = "latest"
firebase = "latest"
# php@8.1 is still managed by Homebrew for now. mise php requires build dependencies such as autoconf.

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
# chrome-devtools の入口は bin/chrome-devtools に固定する (ai/README.md 参照)。
# 理由: 本体 npm:chrome-devtools-mcp も同名コマンドを持ち、mise activate は shims を PATH に残す。
# shim があると bin/chrome-devtools より先に拾われるので、この名前だけ shim を作らせない。
# 本体を [tools] にも載せない。active な tool の実 bin dir は ~/.local/bin より前に出る。
shims.exclude = ["chrome-devtools"]

[settings.status]
